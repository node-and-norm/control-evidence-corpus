name: Prepare CEC agent package
on:
  push:
    branches: [engineering/cec-agent-package]
    paths:
      - 'scripts/migrate_agent_runtime_once.py'
      - 'scripts/check_catholic_agent_package.py'
      - 'tests/test_catholic_agent_package.py'
      - '.github/workflows/prepare-agent-package.yml'
permissions:
  contents: read
concurrency:
  group: prepare-cec-agent-package
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/engineering/cec-agent-package'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CEC_REQUIRE_AGENT_TEAM: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the checksum-guarded extraction
        run: python scripts/migrate_agent_runtime_once.py
      - name: Install the actual package and notebook dependencies
        run: python -m pip install '.[agents]' -r requirements.txt -r catholic-ai-pilot/requirements.txt
      - name: Compare full old and new behavior under network denial
        run: python scripts/check_catholic_agent_package.py --expect-installed-wheel --output /tmp/cec-runtime-refactor.json
      - name: Run all repository and notebook checks
        run: |
          python scripts/check_catholic_pilot.py --execute --output /tmp/cec-runtime-custody.json
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- README.md CATHOLIC_PILOT.ipynb catholic-ai-pilot/_evidence
      - name: Record actual validation and commit only allowed generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('catholic-ai-pilot/_provenance/runtime-refactor-validation.json')
          r=json.loads(Path('/tmp/cec-runtime-refactor.json').read_text())
          r['validation_workflow_run']=os.environ['GITHUB_RUN_ID']
          r['tested_preparation_commit']=os.environ['GITHUB_SHA']
          r['all_repository_tests_passed']=True
          r['notebook_execution_passed']=True
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name 'node-and-norm research automation'
          git config user.email '90214617+mj3b@users.noreply.github.com'
          git add src/cec_agents pyproject.toml .gitignore catholic-ai-pilot/_tools/agent_team.py catholic-ai-pilot/_tools/prompt_trace.py catholic-ai-pilot/_tools/agent-team-requirements.txt scripts/build_catholic_agent_team.py catholic-ai-pilot/17_Agent_Team_and_Assurance.ipynb catholic-ai-pilot/09_Reproduce_and_Inspect.ipynb catholic-ai-pilot/_provenance/runtime-refactor.json catholic-ai-pilot/_provenance/runtime-refactor-validation.json
          git diff --cached --quiet && exit 1
          git commit -m 'Extract checked runtime package; preserve notebook URLs and all prior evidence'
          git push origin HEAD:engineering/cec-agent-package
      - name: Export checked files and environment
        run: |
          mkdir -p /tmp/cec-package-checked
          git rev-parse HEAD > /tmp/cec-package-checked/COMMIT
          git archive --format=zip --output=/tmp/cec-package-checked/repo.zip HEAD
          cp /tmp/cec-runtime-*.json /tmp/cec-package-checked/
          python -m pip freeze > /tmp/cec-package-checked/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cec-package-preparation
          path: |
            /tmp/cec-package-checked/*
            /tmp/cec-runtime-*.json
          retention-days: 30
          if-no-files-found: warn

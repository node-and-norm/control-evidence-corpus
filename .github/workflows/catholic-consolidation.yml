name: Catholic pilot consolidation
on:
  push:
    branches: [maintenance/catholic-pilot-consolidation]
    paths:
      - '.github/workflows/catholic-consolidation.yml'
      - 'scripts/consolidate_catholic_pilot.py'
permissions:
  contents: read
concurrency:
  group: catholic-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned notebook and repository requirements
        run: python -m pip install -r requirements.txt nbformat==5.10.4 nbclient==0.10.4 ipykernel==7.2.0
      - name: Consolidate without research calls or history rewriting
        run: python scripts/consolidate_catholic_pilot.py
      - name: Validate current notebooks, original output custody and evidence hashes
        run: python scripts/check_catholic_pilot.py --execute --output catholic-ai-pilot/_provenance/consolidation-validation.json
      - name: Verify complete repository, including unrelated existing research
        run: |
          python scripts/build_schemas.py
          git diff --exit-code -- schemas
          python scripts/build_examples.py
          git diff --exit-code -- examples
          python scripts/check_docs.py
          python scripts/validate.py examples/synthetic.json
          python -m unittest discover -s tests -v
          python scripts/export.py examples/synthetic.json --output build/synthetic-export.json
          (cd experiments/us-control-sandbox && python -B -m unittest discover -s tests -v && python -B verify_archive.py && python -B build_evidence_appendices.py --check --output evidence-appendices/v0.1)
          git diff --exit-code -- README.md schemas examples experiments
      - name: Commit only the scoped consolidation, without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- CATHOLIC_PILOT.ipynb catholic-ai-pilot research/extensions/catholic-institutions docs/README.md docs/policies/AI_USE_POLICY.md tests scripts/check_catholic_pilot.py scripts/consolidate_catholic_pilot.py scripts/build_catholic_notebook_book.py scripts/check_catholic_notebook_book.py .github/workflows
          git diff --cached --stat
          git commit -m 'Consolidate Catholic pilot: root complete workbook, one evidence set, history-only old readers'
          git push origin HEAD:maintenance/catholic-pilot-consolidation
          mkdir -p /tmp/consolidation-checked
          git archive --format=zip --output=/tmp/consolidation-checked/current.zip HEAD
          git rev-parse HEAD > /tmp/consolidation-checked/COMMIT
          sha256sum /tmp/consolidation-checked/current.zip > /tmp/consolidation-checked/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: catholic-consolidation-checked
          path: /tmp/consolidation-checked/*
          retention-days: 7
          if-no-files-found: error

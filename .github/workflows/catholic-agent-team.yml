name: Catholic agent team engineering
on:
  push:
    branches: [engineering/catholic-spec-agent-team, main]
    paths:
      - '.github/workflows/catholic-agent-team.yml'
      - 'catholic-ai-pilot/_tools/agent_team.py'
      - 'catholic-ai-pilot/_tools/agent-team-requirements.txt'
      - 'catholic-ai-pilot/_evidence/agent-team/**'
      - 'scripts/build_catholic_agent_team.py'
      - 'tests/test_catholic_agent_team.py'
  pull_request:
    paths:
      - '.github/workflows/catholic-agent-team.yml'
      - 'catholic-ai-pilot/**'
      - 'scripts/build_catholic_agent_team.py'
      - 'tests/test_catholic_agent_team.py'
permissions:
  contents: read
concurrency:
  group: catholic-agent-team-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/engineering/catholic-spec-agent-team'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CEC_REQUIRE_AGENT_TEAM: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated engineering and notebook dependencies
        run: python -m pip install -r requirements.txt -r catholic-ai-pilot/requirements.txt -r catholic-ai-pilot/_tools/agent-team-requirements.txt
      - name: Execute synthetic graph with network denied and generate reader
        run: python scripts/build_catholic_agent_team.py
      - name: Verify all preserved research records and notebook execution
        run: |
          python scripts/check_catholic_pilot.py --execute --output /tmp/catholic-agent-team-custody.json
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
      - name: Commit only reviewed reader, engineering evidence and navigation changes
        run: |
          git config user.name 'node-and-norm research automation'
          git config user.email '90214617+mj3b@users.noreply.github.com'
          git add CATHOLIC_PILOT.ipynb catholic-ai-pilot/00_START_HERE.ipynb catholic-ai-pilot/07_AI_Disclosure.ipynb catholic-ai-pilot/17_Agent_Team_and_Assurance.ipynb catholic-ai-pilot/myst.yml catholic-ai-pilot/_provenance/book-manifest.json catholic-ai-pilot/_evidence/agent-team catholic-ai-pilot/_evidence/disclosure/agent-team-20261114.json catholic-ai-pilot/_evidence/disclosure/agent-team-policy-check-20261114.json scripts/check_catholic_pilot.py tests/test_catholic_pilot_integrity.py
          git diff --cached --quiet || git commit -m 'Record tested LangGraph fixture evidence and notebook-first assurance/disclosure guide'
          git push origin HEAD:engineering/catholic-spec-agent-team
      - name: Export exact checked revision for inspection
        run: |
          mkdir -p /tmp/catholic-agent-team-qa
          git rev-parse HEAD > /tmp/catholic-agent-team-qa/COMMIT
          git archive --format=zip --output=/tmp/catholic-agent-team-qa/repo.zip HEAD
          cp /tmp/catholic-agent-team-custody.json /tmp/catholic-agent-team-qa/custody.json
          python -m pip freeze > /tmp/catholic-agent-team-qa/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: catholic-agent-team-checked
          path: /tmp/catholic-agent-team-qa/*
          retention-days: 7
          if-no-files-found: error
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CEC_REQUIRE_AGENT_TEAM: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned prototype dependencies
        run: python -m pip install -r requirements.txt -r catholic-ai-pilot/requirements.txt -r catholic-ai-pilot/_tools/agent-team-requirements.txt
      - name: Test spec-linked behavior and preserved reader/evidence contracts
        run: |
          python -m unittest discover -s tests -p test_catholic_agent_team.py -v
          python scripts/check_catholic_pilot.py --execute --output /tmp/catholic-agent-team-validation.json
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- CATHOLIC_PILOT.ipynb catholic-ai-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: catholic-agent-team-validation
          path: /tmp/catholic-agent-team-validation.json
          if-no-files-found: error

name: Catholic agent team engineering
on:
  push:
    branches: [main, engineering/cec-agent-package]
    paths:
      - 'src/cec_agents/**'
      - 'specs/agent-team/**'
      - 'pyproject.toml'
      - '.github/workflows/catholic-agent-team.yml'
      - 'catholic-ai-pilot/**'
      - 'scripts/check_catholic_agent_package.py'
      - 'scripts/build_catholic_agent_team.py'
      - 'tests/test_catholic_agent*.py'
  pull_request:
    paths:
      - 'src/cec_agents/**'
      - 'specs/agent-team/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'catholic-ai-pilot/**'
      - 'scripts/check_catholic_agent_package.py'
      - 'scripts/build_catholic_agent_team.py'
      - 'tests/test_catholic_agent*.py'
permissions:
  contents: read
concurrency:
  group: catholic-agent-team-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CEC_REQUIRE_AGENT_TEAM: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and existing notebook dependencies
        run: python -m pip install '.[agents]' -r requirements.txt -r catholic-ai-pilot/requirements.txt
      - name: Run existing and new agent contract tests
        run: |
          python -m unittest discover -s tests -p 'test_catholic_agent*.py' -v
          python scripts/check_catholic_agent_package.py --expect-installed-wheel --output "$RUNNER_TEMP/cec-package-comparison.json"
      - name: Build a wheel without bundling research data
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/cec-wheel" .
      - name: Install and test the wheel outside the source checkout
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/cec-wheel-env"
          "$RUNNER_TEMP/cec-wheel-env/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/cec-wheel/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/cec-wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_catholic_agent_package.py" --expect-installed-wheel --output "$RUNNER_TEMP/cec-package-wheel.json"
      - name: Validate notebooks and all retained research contracts
        run: |
          python scripts/check_catholic_pilot.py --execute --output "$RUNNER_TEMP/cec-package-custody.json"
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- README.md CATHOLIC_PILOT.ipynb catholic-ai-pilot src specs
          python -m pip freeze > "$RUNNER_TEMP/cec-package-environment.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cec-agent-package-validation
          path: |
            ${{ runner.temp }}/cec-package-*.json
            ${{ runner.temp }}/cec-package-environment.txt
          retention-days: 90
          if-no-files-found: error

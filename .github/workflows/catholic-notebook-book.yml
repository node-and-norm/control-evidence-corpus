name: Catholic notebook book
on:
  push:
    branches: [docs/catholic-notebook-book]
    paths:
      - 'scripts/build_catholic_notebook_book.py'
      - 'scripts/check_catholic_notebook_book.py'
      - '.github/workflows/catholic-notebook-book.yml'
  pull_request:
    paths:
      - 'catholic-ai-pilot/**'
      - 'CATHOLIC_PILOT.ipynb'
      - 'scripts/*catholic_notebook_book.py'
      - 'tests/test_catholic_notebook_book.py'
      - '.github/workflows/catholic-notebook-book.yml'
permissions:
  contents: read
concurrency:
  group: catholic-notebook-book-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt -r research/extensions/catholic-institutions/requirements-reading.txt
      - name: Build top-level notebook book from preserved sources
        run: python scripts/build_catholic_notebook_book.py --navigation
      - name: Verify all source text, navigation and stored responses; execute local checks
        run: python scripts/check_catholic_notebook_book.py --execute
      - name: Run repository checks
        run: |
          python scripts/check_docs.py
          python -m unittest discover -s tests -v
      - name: Preserve historical evidence and publication bytes
        run: |
          git diff --exit-code -- research/extensions/catholic-institutions/data research/extensions/catholic-institutions/runs research/extensions/catholic-institutions/scenario-batches research/extensions/catholic-institutions/reading/editions
      - name: Commit reader outputs and bounded navigation changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catholic-ai-pilot CATHOLIC_PILOT.ipynb README.md tests/test_catholic_reader_archive.py research/extensions/catholic-institutions/README.md research/extensions/catholic-institutions/scripts/test_release.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish top-level Catholic notebook book with source-fidelity checks'
            git push origin HEAD:docs/catholic-notebook-book
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catholic-notebook-book-navigation-1
          path: |
            catholic-ai-pilot/
            CATHOLIC_PILOT.ipynb
          if-no-files-found: error
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook validation dependency
        run: python -m pip install nbformat==5.10.4
      - name: Check the committed book against fixed source records
        run: |
          python scripts/check_catholic_notebook_book.py
          python -m unittest discover -s tests -p test_catholic_notebook_book.py -v

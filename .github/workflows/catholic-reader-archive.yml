name: Archive delivered Catholic study readers
on:
  push:
    branches: [research/catholic-first-five-scenarios]
    paths:
      - 'research/extensions/catholic-institutions/reading/archive-support/**'
      - 'research/extensions/catholic-institutions/scripts/archive_readers.py'
      - '.github/workflows/catholic-reader-archive.yml'
permissions:
  contents: read
concurrency:
  group: catholic-reader-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXT: research/extensions/catholic-institutions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned reading dependencies
        run: |
          python -m pip install -r "$EXT/requirements-reading.txt"
          python -m playwright install --with-deps chromium
      - name: Restore exact notebooks and text; replay offline; render PDFs
        run: python "$EXT/scripts/archive_readers.py" --execute --pdf
      - name: Check main README and preserved study evidence
        run: |
          git diff --exit-code -- README.md "$EXT/data" "$EXT/runs" "$EXT/scenario-batches"
      - name: Commit archival artifacts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXT/reading/editions" "$EXT/reading/ARTIFACT_INDEX.json" "$EXT/reading/archive-support/retained-notebook-metadata.json" "$EXT/reading/archive-support/cir001/replay-inputs"
          if ! git diff --cached --quiet; then
            git commit -m 'Archive delivered 0.4.2–0.4.4 notebooks and reader editions with verified hashes'
            git push origin HEAD:research/catholic-first-five-scenarios
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catholic-reader-archive-0.4.2-through-0.4.4
          path: |
            research/extensions/catholic-institutions/reading/editions/
            research/extensions/catholic-institutions/reading/ARTIFACT_INDEX.json
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Six-stage research workflow</title><desc id="desc">Discover, Screen, Review, Reconstruct, Evaluate, Report. Planning sequence, not completed stages.</desc><rect width="1080" height="390" rx="18" fill="#f7f6f3"/><rect x="22" y="25" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="40" y="53" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">01</text><text x="40" y="87" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Discover</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Sources and candidate risks</text><text x="40" y="141" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Retain source identities</text><rect x="378" y="25" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="396" y="53" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">02</text><text x="396" y="87" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Screen</text><text x="396" y="117" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Institutional relevance</text><text x="396" y="141" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Keep exclusion reasons</text><rect x="734" y="25" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="752" y="53" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">03</text><text x="752" y="87" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Review</text><text x="752" y="117" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Qualified judgments</text><text x="752" y="141" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Record disagreements</text><rect x="22" y="190" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="40" y="218" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">04</text><text x="40" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Reconstruct</text><text x="40" y="282" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Control opportunities</text><text x="40" y="306" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Retain missing evidence</text><rect x="378" y="190" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="396" y="218" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">05</text><text x="396" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Evaluate</text><text x="396" y="282" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Frozen comparisons</text><text x="396" y="306" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Keep failed trials</text><rect x="734" y="190" width="324" height="140" rx="12" fill="white" stroke="#d7d1e7"/><text x="752" y="218" font-family="Arial,sans-serif" font-size="15" fill="#5145cd">06</text><text x="752" y="252" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#1c1923">Report</text><text x="752" y="282" font-family="Arial,sans-serif" font-size="15" fill="#5f5b67">Bounded findings</text><text x="752" y="306" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Disclose review status</text><text x="25" y="370" font-family="Arial,sans-serif" font-size="14" fill="#5f5b67">Planning sequence only. Research completion and independent review require separate evidence.</text></svg>